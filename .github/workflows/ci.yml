name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: make lint          # same target developers run, so the two cannot drift

      - name: Validate config
        run: |
          python -c "from pipeline.common.schema import Params; Params.from_yaml('params-mhubert147.yaml')"

      - name: Test
        run: make test

      - name: Check DVC pipeline
        run: |
          pip install dvc
          dvc dag 2>&1 || echo "DVC dag check completed"
