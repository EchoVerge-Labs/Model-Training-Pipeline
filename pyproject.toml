[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echoverge-pipeline"
version = "0.1.0"
description = "Continued SSL pre-training of speech encoders (XLS-R, wav2vec2, WavLM, HuBERT, mHuBERT) on Sinhala/Tamil"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "soundfile",
    "pydantic>=2.0",
    "pyyaml",
    "mlflow",
]

[project.optional-dependencies]
data = ["lhotse", "gspread", "google-auth", "scikit-learn", "joblib"]
benchmark = ["slsb @ git+https://github.com/EchoVerge-Labs/SLSB-benchmark.git@v0.5.0"]
dev = ["pytest", "ruff"]

[tool.hatch.metadata]
# needed for the `slsb @ git+https://...` reference in the benchmark extra
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
