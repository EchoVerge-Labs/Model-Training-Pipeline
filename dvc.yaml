vars:
  - params-mhubert147.yaml

stages:

  snapshot_catalog:
    cmd: python -m pipeline.data.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/data/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.data.drive_index --config params-data.yaml
    deps:
      - src/pipeline/data/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - params-data.yaml:
          - select.drive_root
          - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache. A selection is named by its data id
  # (pipeline.common.naming): si-ta-200h is the default 200 h Sinhala+Tamil selection.
  select:
    cmd: python -m pipeline.data.select --config params-data.yaml
    deps:
      - src/pipeline/data/select.py
      - src/pipeline/data/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - params-data.yaml:
          - select
    outs:
      - data/manifests/si-ta-200h/train.jsonl:
          cache: false
      - data/manifests/si-ta-200h/dev.jsonl:
          cache: false
      - data/manifests/si-ta-200h/selection.json:
          cache: false
      - reports/data/si-ta-200h/selection_report.md:
          cache: false
      - reports/data/si-ta-200h/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/data/si-ta-200h/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.data.materialise --config params-data.yaml
    deps:
      - src/pipeline/data/materialise.py
      - data/manifests/si-ta-200h/train.jsonl
      - data/manifests/si-ta-200h/dev.jsonl
    params:
      - params-data.yaml:
          - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/data/si-ta-200h/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.data.shard --config params-data.yaml
    deps:
      - src/pipeline/data/shard.py
      - data/raw/
      - data/manifests/si-ta-200h/train.jsonl
    params:
      - params-data.yaml:
          - shard
    outs:
      - data/shars/si-ta-200h/

  fit_kmeans:
    cmd: python -m pipeline.labels.fit_kmeans --config params-mhubert147.yaml
    deps:
      - src/pipeline/labels/fit_kmeans.py
      - src/pipeline/labels/layer_features.py
      - src/pipeline/common/datamodule.py
      - data/shars/si-ta-200h/
    params:
      - params-mhubert147.yaml:
          - cluster
          - pretrain.base_model
      - params-data.yaml:
          - shard
    outs:
      - models/kmeans/mhubert147-L9-k500-si-ta-200h.joblib:
          persist: true
    metrics:
      - reports/data/si-ta-200h/kmeans-mhubert147-L9-k500-si-ta-200h.json:
          cache: false

  assign_cluster_labels:
    cmd: python -m pipeline.labels.assign_cluster_labels --config params-mhubert147.yaml
    deps:
      - src/pipeline/labels/assign_cluster_labels.py
      - src/pipeline/labels/layer_features.py
      - src/pipeline/common/datamodule.py
      - models/kmeans/mhubert147-L9-k500-si-ta-200h.joblib
      - data/shars/si-ta-200h/
    params:
      - params-mhubert147.yaml:
          - cluster
          - pretrain.base_model
      - params-data.yaml:
          - shard
    outs:
      - data/labels/mhubert147-L9-k500-si-ta-200h.jsonl.gz:
          persist: true

  pretrain:
    cmd: bash scripts/launch_pretrain.sh --config params-mhubert147.yaml
    deps:
      - src/pipeline/train.py
      - src/pipeline/training/masked_prediction.py
      - src/pipeline/common/datamodule.py
      - src/pipeline/common/callbacks.py
      - src/pipeline/training/masked_model.py
      - src/pipeline/common/checkpoints.py
      - data/shars/si-ta-200h/
      - data/labels/mhubert147-L9-k500-si-ta-200h.jsonl.gz
    params:
      - params-mhubert147.yaml:
          - pretrain
          - cluster.num_clusters
    outs:
      # the run's folder: checkpoints, final model, selected/ (make ckpt), run.json
      - models/mhubert147-copt-si-ta-200h/:
          persist: true
    metrics:
      - reports/mhubert147-copt-si-ta-200h/pretrain_metrics.json:
          cache: false
    plots:
      - reports/mhubert147-copt-si-ta-200h/pretrain_curves.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.eval.select_checkpoint --config params-mhubert147.yaml
    deps:
      - src/pipeline/eval/select_checkpoint.py
      - models/mhubert147-copt-si-ta-200h/
    params:
      - params-mhubert147.yaml:
          - checkpoint_selection
    # writes models/mhubert147-copt-si-ta-200h/selected/, inside the pretrain stage's output (DVC allows no
    # nested outputs), so its declared output is the selection report
    metrics:
      - reports/mhubert147-copt-si-ta-200h/checkpoint_selection.json:
          cache: false

  benchmark:
    cmd: python -m pipeline.eval.benchmark --config params-mhubert147.yaml
    deps:
      - reports/mhubert147-copt-si-ta-200h/checkpoint_selection.json
      - src/pipeline/eval/benchmark.py
    params:
      - params-mhubert147.yaml:
          - benchmark.tasks
          - benchmark.seeds
          - benchmark.slsb_data_dir
          - benchmark.slsb_version
    metrics:
      - reports/mhubert147-copt-si-ta-200h/bench/metrics.json:
          cache: false

  report:
    cmd: python -m pipeline.eval.report --config params-mhubert147.yaml
    deps:
      - src/pipeline/eval/report.py
      - reports/mhubert147-copt-si-ta-200h/bench/metrics.json
    outs:
      - reports/mhubert147-copt-si-ta-200h/results.md:
          cache: false
      - reports/mhubert147-copt-si-ta-200h/results_table.csv:
          cache: false
