stages:

  snapshot_catalog:
    cmd: python -m pipeline.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.drive_index --config params.yaml
    deps:
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - select.drive_root
      - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache.
  select:
    cmd: python -m pipeline.select --config params.yaml
    deps:
      - src/pipeline/select.py
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - select
    outs:
      - data/manifests/train.jsonl:
          cache: false
      - data/manifests/dev.jsonl:
          cache: false
      - reports/selection_report.md:
          cache: false
      - reports/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.materialise --config params.yaml
    deps:
      - src/pipeline/materialise.py
      - data/manifests/train.jsonl
      - data/manifests/dev.jsonl
    params:
      - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.shard --config params.yaml
    deps:
      - src/pipeline/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - shard
    outs:
      - data/shars/

  fit_kmeans:
    cmd: python -m pipeline.fit_kmeans --config params.yaml
    deps:
      - src/pipeline/fit_kmeans.py
      - src/pipeline/mfcc_features.py
      - src/pipeline/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - cluster
      - shard
      - pretrain.base_model
    outs:
      - models/kmeans/km_model.joblib:
          persist: true
    metrics:
      - reports/kmeans_stats.json:
          cache: false

  assign_cluster_labels:
    cmd: python -m pipeline.assign_cluster_labels --config params.yaml
    deps:
      - src/pipeline/assign_cluster_labels.py
      - src/pipeline/mfcc_features.py
      - models/kmeans/km_model.joblib
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - cluster
      - shard
      - pretrain.base_model
    outs:
      - data/labels/train_labels.jsonl.gz:
          persist: true

  pretrain:
    cmd: bash scripts/launch_pretrain.sh
    deps:
      - src/pipeline/train.py
      - src/pipeline/datamodule.py
      - src/pipeline/callbacks.py
      - src/pipeline/hubert_model.py
      - data/shars/
      - data/labels/train_labels.jsonl.gz
    params:
      - pretrain
      - cluster.num_clusters
    outs:
      - models/hubert-large-si-ta-200h/:
          persist: true
    metrics:
      - reports/pretrain_metrics.json:
          cache: false
    plots:
      - reports/pretrain_curves.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.select_checkpoint --config params.yaml
    deps:
      - src/pipeline/select_checkpoint.py
      - models/hubert-large-si-ta-200h/
    params:
      - checkpoint_selection
    outs:
      - models/selected/:
          persist: true
    metrics:
      - reports/checkpoint_selection.json:
          cache: false

  benchmark:
    cmd: >
      bash scripts/run_benchmark.sh
      models/selected
      ${benchmark.tasks}
      ${benchmark.seeds}
      reports/bench/xlsr300m_adapted
      ${benchmark.mlflow_uri}
    deps:
      - models/selected/
      - scripts/run_benchmark.sh
    params:
      - benchmark.tasks
      - benchmark.seeds
    metrics:
      - reports/bench/xlsr300m_adapted/metrics.json:
          cache: false

  report:
    cmd: python -m pipeline.report --config params.yaml
    deps:
      - src/pipeline/report.py
      - reports/bench/
    outs:
      - reports/results.md:
          cache: false
      - reports/results_table.csv:
          cache: false
