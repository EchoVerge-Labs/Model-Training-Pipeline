stages:

  snapshot_catalog:
    cmd: python -m pipeline.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.drive_index --config params.yaml
    deps:
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - select.drive_root
      - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache.
  select:
    cmd: python -m pipeline.select --config params.yaml
    deps:
      - src/pipeline/select.py
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - select
    outs:
      - data/manifests/train.jsonl:
          cache: false
      - data/manifests/dev.jsonl:
          cache: false
      - reports/selection_report.md:
          cache: false
      - reports/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.materialise --config params.yaml
    deps:
      - src/pipeline/materialise.py
      - data/manifests/train.jsonl
      - data/manifests/dev.jsonl
    params:
      - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.shard --config params.yaml
    deps:
      - src/pipeline/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - shard
    outs:
      - data/shars/

  fit_kmeans:
    cmd: python -m pipeline.fit_kmeans --config params.yaml
    deps:
      - src/pipeline/fit_kmeans.py
      - src/pipeline/layer_features.py
      - src/pipeline/datamodule.py
      - data/shars/
    params:
      - cluster
      - shard
      - pretrain.base_model
    outs:
      - models/kmeans/wavlm-large-L18-k500.joblib:
          persist: true
    metrics:
      - reports/kmeans_stats.json:
          cache: false

  assign_cluster_labels:
    cmd: python -m pipeline.assign_cluster_labels --config params.yaml
    deps:
      - src/pipeline/assign_cluster_labels.py
      - src/pipeline/layer_features.py
      - src/pipeline/datamodule.py
      - models/kmeans/wavlm-large-L18-k500.joblib
      - data/shars/
    params:
      - cluster
      - shard
      - pretrain.base_model
    outs:
      - data/labels/wavlm_train_labels.jsonl.gz:
          persist: true

  pretrain:
    cmd: bash scripts/launch_pretrain.sh
    deps:
      - src/pipeline/train.py
      - src/pipeline/datamodule.py
      - src/pipeline/callbacks.py
      - src/pipeline/wavlm_model.py
      - src/pipeline/checkpoints.py
      - data/shars/
      - data/labels/wavlm_train_labels.jsonl.gz
    params:
      - pretrain
      - cluster.num_clusters
    outs:
      - models/wavlm-large-si-ta-200h/:
          persist: true
    metrics:
      - reports/pretrain_metrics.json:
          cache: false
    plots:
      - reports/pretrain_curves.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.select_checkpoint --config params.yaml
    deps:
      - src/pipeline/select_checkpoint.py
      - models/wavlm-large-si-ta-200h/
    params:
      - checkpoint_selection
    outs:
      - models/selected/:
          persist: true
    metrics:
      - reports/checkpoint_selection.json:
          cache: false

  benchmark:
    cmd: >
      bash scripts/run_benchmark.sh
      models/selected
      ${benchmark.tasks}
      ${benchmark.seeds}
      reports/bench/wavlm_large_adapted
      ${benchmark.mlflow_uri}
    deps:
      - models/selected/
      - scripts/run_benchmark.sh
    params:
      - benchmark.tasks
      - benchmark.seeds
    metrics:
      - reports/bench/wavlm_large_adapted/metrics.json:
          cache: false

  # ── Single-language ablation runs (params.yaml `experiments.runs`) ──────────
  # One chain per run, e.g. `dvc repro -s select_single@si-100h`. Each reuses the
  # shared snapshot/index stages and writes only under its own name: manifests,
  # shards, models/, reports/ -- nothing the joint stages above produce.
  select_single:
    foreach: ${experiments.runs}
    do:
      cmd: python -m pipeline.select --config params.yaml --experiment ${key}
      deps:
        - src/pipeline/select.py
        - src/pipeline/experiment.py
        - data/manifests/train.jsonl
        - data/manifests/dev.jsonl
      params:
        - experiments.runs.${key}
      outs:
        - data/manifests/${key}/train.jsonl:
            cache: false
        - data/manifests/${key}/dev.jsonl:
            cache: false
        - reports/${key}/selection_report.md:
            cache: false
      metrics:
        - reports/${key}/selection_stats.json:
            cache: false

  # Copies into the shared data/raw/ (owned by `materialise`; idempotent), so only its
  # report is declared here.
  materialise_single:
    foreach: ${experiments.runs}
    do:
      cmd: python -m pipeline.materialise --config params.yaml --experiment ${key}
      deps:
        - src/pipeline/materialise.py
        - data/manifests/${key}/train.jsonl
        - data/manifests/${key}/dev.jsonl
      params:
        - select.drive_root
      outs:
        - reports/${key}/materialise.json:
            cache: false

  shard_single:
    foreach: ${experiments.runs}
    do:
      cmd: python -m pipeline.shard --config params.yaml --experiment ${key}
      deps:
        - src/pipeline/shard.py
        - src/pipeline/experiment.py
        - reports/${key}/materialise.json
        - data/manifests/${key}/train.jsonl
      params:
        - shard
        - select.seed
        - experiments.runs.${key}
      outs:
        - data/shars_single/${key}/

  # Labels for this run's shards from the JOINT run's k-means, so the masked-prediction
  # targets are defined exactly as in the joint model. Requires models/kmeans/... (fit_kmeans).
  assign_cluster_labels_single:
    foreach: ${experiments.runs}
    do:
      cmd: python -m pipeline.assign_cluster_labels --config params.yaml --experiment ${key}
      deps:
        - src/pipeline/assign_cluster_labels.py
        - src/pipeline/layer_features.py
        - src/pipeline/datamodule.py
        - src/pipeline/experiment.py
        - models/kmeans/wavlm-large-L18-k500.joblib
        - data/shars_single/${key}/
      params:
        - cluster
        - pretrain.base_model
        - experiments.runs.${key}
      outs:
        - data/labels/${key}/wavlm_train_labels.jsonl.gz:
            persist: true

  pretrain_single:
    foreach: ${experiments.runs}
    do:
      cmd: bash scripts/launch_pretrain.sh --experiment ${key}
      deps:
        - src/pipeline/train.py
        - src/pipeline/datamodule.py
        - src/pipeline/callbacks.py
        - src/pipeline/experiment.py
        - src/pipeline/wavlm_model.py
        - src/pipeline/checkpoints.py
        - data/shars_single/${key}/
        - data/labels/${key}/wavlm_train_labels.jsonl.gz
      params:
        - pretrain
        - cluster.num_clusters
        - experiments.runs.${key}
      outs:
        - models/${experiments.backbone_tag}-${key}/:
            persist: true
      metrics:
        - reports/${key}/pretrain_metrics.json:
            cache: false
      plots:
        - reports/${key}/pretrain_curves.csv:
            cache: false

  select_checkpoint_single:
    foreach: ${experiments.runs}
    do:
      cmd: python -m pipeline.select_checkpoint --config params.yaml --experiment ${key}
      deps:
        - src/pipeline/select_checkpoint.py
        - src/pipeline/experiment.py
        - models/${experiments.backbone_tag}-${key}/
      params:
        - checkpoint_selection
        - pretrain.milestone_checkpoints
      outs:
        - models/selected_single/${experiments.backbone_tag}-${key}/:
            persist: true
      metrics:
        - reports/${key}/checkpoint_selection.json:
            cache: false

  benchmark_single:
    foreach: ${experiments.runs}
    do:
      cmd: >
        bash scripts/run_benchmark.sh
        models/selected_single/${experiments.backbone_tag}-${key}
        ${benchmark.tasks}
        ${benchmark.seeds}
        reports/bench/${experiments.backbone_tag}-${key}
        ${benchmark.mlflow_uri}
      deps:
        - models/selected_single/${experiments.backbone_tag}-${key}/
        - scripts/run_benchmark.sh
      params:
        - benchmark.tasks
        - benchmark.seeds
      metrics:
        - reports/bench/${experiments.backbone_tag}-${key}/metrics.json:
            cache: false

  report:
    cmd: python -m pipeline.report --config params.yaml
    deps:
      - src/pipeline/report.py
      - reports/bench/
    outs:
      - reports/results.md:
          cache: false
      - reports/results_table.csv:
          cache: false
      - reports/results_ablation.md:
          cache: false
      - reports/results_ablation.csv:
          cache: false
