vars:
  - params-mhubert147.yaml

stages:

  snapshot_catalog:
    cmd: python -m pipeline.data.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/data/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.data.drive_index --config params-data.yaml
    deps:
      - src/pipeline/data/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - params-data.yaml:
          - select.drive_root
          - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache.
  select:
    cmd: python -m pipeline.data.select --config params-data.yaml
    deps:
      - src/pipeline/data/select.py
      - src/pipeline/data/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - params-data.yaml:
          - select
    outs:
      - data/manifests/train.jsonl:
          cache: false
      - data/manifests/dev.jsonl:
          cache: false
      - reports/selection_report.md:
          cache: false
      - reports/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.data.materialise --config params-data.yaml
    deps:
      - src/pipeline/data/materialise.py
      - data/manifests/train.jsonl
      - data/manifests/dev.jsonl
    params:
      - params-data.yaml:
          - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.data.shard --config params-data.yaml
    deps:
      - src/pipeline/data/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - params-data.yaml:
          - shard
    outs:
      - data/shars/

  fit_kmeans:
    cmd: python -m pipeline.labels.fit_kmeans --config params-mhubert147.yaml
    deps:
      - src/pipeline/labels/fit_kmeans.py
      - src/pipeline/labels/layer_features.py
      - src/pipeline/common/datamodule.py
      - data/shars/
    params:
      - params-mhubert147.yaml:
          - cluster
          - pretrain.base_model
      - params-data.yaml:
          - shard
    outs:
      - models/kmeans/mhubert147-L9-k500.joblib:
          persist: true
    metrics:
      - reports/kmeans_stats-mhubert147-si-ta-200h.json:
          cache: false

  assign_cluster_labels:
    cmd: python -m pipeline.labels.assign_cluster_labels --config params-mhubert147.yaml
    deps:
      - src/pipeline/labels/assign_cluster_labels.py
      - src/pipeline/labels/layer_features.py
      - src/pipeline/common/datamodule.py
      - models/kmeans/mhubert147-L9-k500.joblib
      - data/shars/
    params:
      - params-mhubert147.yaml:
          - cluster
          - pretrain.base_model
      - params-data.yaml:
          - shard
    outs:
      - data/labels/mhubert147_train_labels.jsonl.gz:
          persist: true

  pretrain:
    cmd: bash scripts/launch_pretrain.sh --config params-mhubert147.yaml
    deps:
      - src/pipeline/train.py
      - src/pipeline/training/masked_prediction.py
      - src/pipeline/common/datamodule.py
      - src/pipeline/common/callbacks.py
      - src/pipeline/training/masked_model.py
      - src/pipeline/common/checkpoints.py
      - data/shars/
      - data/labels/mhubert147_train_labels.jsonl.gz
    params:
      - params-mhubert147.yaml:
          - pretrain
          - cluster.num_clusters
    outs:
      - models/mhubert147-si-ta-200h/:
          persist: true
    metrics:
      - reports/pretrain_metrics-mhubert147-si-ta-200h.json:
          cache: false
    plots:
      - reports/pretrain_curves-mhubert147-si-ta-200h.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.eval.select_checkpoint --config params-mhubert147.yaml
    deps:
      - src/pipeline/eval/select_checkpoint.py
      - models/mhubert147-si-ta-200h/
    params:
      - params-mhubert147.yaml:
          - checkpoint_selection
    outs:
      - models/selected-mhubert147-si-ta-200h/:
          persist: true
    metrics:
      - reports/checkpoint_selection-mhubert147-si-ta-200h.json:
          cache: false

  benchmark:
    cmd: >
      bash scripts/run_benchmark.sh
      models/selected-mhubert147-si-ta-200h
      ${benchmark.tasks}
      ${benchmark.seeds}
      reports/bench/mhubert147-si-ta-200h
      ${benchmark.mlflow_uri}
      ${benchmark.slsb_data_dir}
    deps:
      - models/selected-mhubert147-si-ta-200h/
      - scripts/run_benchmark.sh
    params:
      - params-mhubert147.yaml:
          - benchmark.tasks
          - benchmark.seeds
          - benchmark.slsb_data_dir
    metrics:
      - reports/bench/mhubert147-si-ta-200h/metrics.json:
          cache: false

  report:
    cmd: python -m pipeline.eval.report --config params-mhubert147.yaml
    deps:
      - src/pipeline/eval/report.py
      - reports/bench/
    outs:
      - reports/results-mhubert147-si-ta-200h.md:
          cache: false
      - reports/results_table-mhubert147-si-ta-200h.csv:
          cache: false
