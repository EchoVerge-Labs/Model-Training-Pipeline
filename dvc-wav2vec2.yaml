stages:

  snapshot_catalog:
    cmd: python -m pipeline.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.drive_index --config params-wav2vec2.yaml
    deps:
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - params-wav2vec2.yaml:
          - select.drive_root
          - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache.
  select:
    cmd: python -m pipeline.select --config params-wav2vec2.yaml
    deps:
      - src/pipeline/select.py
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - params-wav2vec2.yaml:
          - select
    outs:
      - data/manifests/train.jsonl:
          cache: false
      - data/manifests/dev.jsonl:
          cache: false
      - reports/selection_report.md:
          cache: false
      - reports/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.materialise --config params-wav2vec2.yaml
    deps:
      - src/pipeline/materialise.py
      - data/manifests/train.jsonl
      - data/manifests/dev.jsonl
    params:
      - params-wav2vec2.yaml:
          - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.shard --config params-wav2vec2.yaml
    deps:
      - src/pipeline/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - params-wav2vec2.yaml:
          - shard
    outs:
      - data/shars/

  pretrain:
    cmd: SCRIPT=src/pipeline/train_wav2vec2.py bash scripts/launch_pretrain.sh --config params-wav2vec2.yaml
    deps:
      - src/pipeline/train_wav2vec2.py
      - src/pipeline/datamodule_xlsr.py
      - src/pipeline/callbacks_xlsr.py
      - data/shars/
    params:
      - params-wav2vec2.yaml:
          - pretrain
          - monitoring
    outs:
      - models/wav2vec2-mono-si-ta-200h/:
          persist: true
    metrics:
      - reports/pretrain_metrics-wav2vec2.json:
          cache: false
    plots:
      - reports/pretrain_curves-wav2vec2.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.select_checkpoint_xlsr --config params-wav2vec2.yaml --report-suffix -wav2vec2
    deps:
      - src/pipeline/select_checkpoint_xlsr.py
      - models/wav2vec2-mono-si-ta-200h/
    params:
      - params-wav2vec2.yaml:
          - checkpoint_selection
    outs:
      - models/selected-wav2vec2/:
          persist: true
    metrics:
      - reports/checkpoint_selection-wav2vec2.json:
          cache: false

  benchmark:
    cmd: >
      bash scripts/run_benchmark-xlsr.sh
      models/selected-wav2vec2
      ${benchmark.tasks}
      ${benchmark.seeds}
      reports/bench/wav2vec2_mono_adapted
      ${benchmark.mlflow_uri}
      ${benchmark.slsb_data_dir}
    deps:
      - models/selected-wav2vec2/
      - scripts/run_benchmark-xlsr.sh
    params:
      - params-wav2vec2.yaml:
          - benchmark.tasks
          - benchmark.seeds
          - benchmark.slsb_data_dir
    metrics:
      - reports/bench/wav2vec2_mono_adapted/metrics.json:
          cache: false

  report:
    cmd: python -m pipeline.report --config params-wav2vec2.yaml --report-suffix -wav2vec2
    deps:
      - src/pipeline/report.py
      - reports/bench/
    outs:
      - reports/results-wav2vec2.md:
          cache: false
      - reports/results_table-wav2vec2.csv:
          cache: false
