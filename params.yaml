# ── Data Selection ──────────────────────────────────
select:
  seed: 1337
  target_hours: 200.0
  language_mix:
    sinhala: 0.50
    tamil: 0.50
  min_segment_seconds: 3.0
  max_segment_seconds: 900
  max_hours_per_channel: 12.0
  holdout_hours: 2.0
  catalog_path: data/catalog/catalog_latest.csv
  exclude_channels_file: data/catalog/eval_contamination_blocklist.txt
  drive_root: ~/google-drive/Pre Processed Data   # mount holding <Lang>/<genre>/<source-dir>/<clip>.wav
  drive_index_path: data/catalog/drive_index.tsv  # relpath + size of every wav under drive_root

# ── Sharding ────────────────────────────────────────
shard:
  format: flac               # inside tar
  shard_size: 1000            # cuts per shard
  min_cut_seconds: 5.0        # minimum after re-cutting
  target_cut_seconds: 15.0    # concatenate short segments to this
  max_cut_seconds: 30.0       # split longer clips into equal windows of at most this
  output_dir: data/shars

# ── Iteration-1 k-means pseudo-labels ────────────────
# HuBERT's real pretraining target: cluster ids from 39-dim MFCC frames
# (13 coeffs + delta + delta-delta), fit on a sample of the training set and
# assigned to every training cut. See pipeline.fit_kmeans / .assign_cluster_labels.
# Iteration 2+ (re-clustering on an earlier checkpoint's hidden states) is
# not implemented -- see README "Known gaps".
cluster:
  num_clusters: 100
  seed: 1337
  sample_hours: 20.0          # ~10% of the 200h corpus, for the k-means fit
  n_mfcc: 13                  # + delta + delta-delta = 39-dim features
  kmeans_output: models/kmeans/km_model.joblib
  labels_output: data/labels/train_labels.jsonl.gz

# ── Pre-training ────────────────────────────────────
pretrain:
  base_model: facebook/hubert-large-ll60k
  precision: bf16
  freeze_feature_encoder: true

  max_updates: 13500          # ~30 passes over 200h (was 50000 / 111 passes)
  warmup_updates: 1000        # ~8% (was 4000)
  peak_lr: 5.0e-5
  lr_schedule: tri_stage      # warmup / hold / exponential decay
  hold_ratio: 0.4             # fraction of remaining after warmup to hold
  optimizer: adamw
  adam_betas: [0.9, 0.98]
  adam_eps: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  # batch size in AUDIO SECONDS (not examples)
  target_batch_seconds: 1600
  per_device_max_seconds: 200
  num_workers: 4

  # HuBERT masking (SpecAugment-style, applied by HubertModel itself)
  mask_time_prob: 0.65
  mask_time_length: 10

  labels_path: data/labels/train_labels.jsonl.gz

  # checkpointing
  save_every_updates: 1500
  eval_every_updates: 500
  keep_last_n_checkpoints: 5
  milestone_checkpoints: [4500, 9000, 13500]   # 10, 20, 30 passes

  output_dir: models/hubert-large-si-ta-200h

# ── Checkpoint Selection ────────────────────────────
checkpoint_selection:
  proxy_task: asr
  proxy_data_dir: null        # filled at runtime from SLSB-benchmark data
  proxy_seed: 0
  output_dir: models/selected

# ── Benchmark ───────────────────────────────────────
benchmark:
  tasks: "asr,sid,er,asv"
  seeds: "0,1,2"
  slsb_data_dir: null         # path to SLSB-benchmark/data
  mlflow_uri: https://dagshub.com/EchoVerge-LABS/Model-Training-Pipeline.mlflow
  upstreams:
    xlsr300m_vanilla:
      path: facebook/wav2vec2-xls-r-300m
      name: "XLS-R 300M (vanilla)"
    mhubert147:
      path: utter-project/mHuBERT-147
      name: "mHuBERT-147"
    wavlm_large:
      path: microsoft/wavlm-large
      name: "WavLM Large"
    xlsr300m_adapted:
      path: models/selected
      name: "XLS-R 300M (Si/Ta 200h)"
      is_local: true

# ── MLflow ──────────────────────────────────────────
mlflow:
  tracking_uri: https://dagshub.com/EchoVerge-LABS/Model-Training-Pipeline.mlflow
  experiment_name: ssl-pretraining
