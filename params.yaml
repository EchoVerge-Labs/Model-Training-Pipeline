# ── Data Selection ──────────────────────────────────
select:
  seed: 1337
  target_hours: 200.0
  language_mix:
    sinhala: 0.50
    tamil: 0.50
  min_segment_seconds: 3.0
  max_segment_seconds: 900
  max_hours_per_channel: 12.0
  holdout_hours: 2.0
  catalog_path: data/catalog/catalog_latest.csv
  exclude_channels_file: data/catalog/eval_contamination_blocklist.txt
  drive_root: ~/google-drive/Pre Processed Data   # mount holding <Lang>/<genre>/<source-dir>/<clip>.wav
  drive_index_path: data/catalog/drive_index.tsv  # relpath + size of every wav under drive_root

# ── Single-language ablation runs ───────────────────
# Each run trains from the base model on ONE language of the joint selection above
# (same channels, same holdout, same seed) with the unchanged `pretrain` recipe below;
# only output locations differ. `target_hours` must equal select.target_hours x that
# language's share of language_mix. Realised hours can be lower (see
# reports/<run>/selection_stats.json). Run with: make run-si-100h / run-ta-100h.
experiments:
  backbone_tag: wavlm-large       # prefix of every output name
  runs:
    si-100h: {language: sinhala, target_hours: 100.0}
    ta-100h: {language: tamil, target_hours: 100.0}

# ── Sharding ────────────────────────────────────────
shard:
  format: flac               # inside tar
  shard_size: 1000            # cuts per shard
  min_cut_seconds: 5.0        # minimum after re-cutting
  target_cut_seconds: 15.0    # concatenate short segments to this
  max_cut_seconds: 30.0       # split longer clips into equal windows of at most this
  output_dir: data/shars

# ── k-means pseudo-labels (WavLM masked-prediction targets) ──
# Cluster ids come from ONE transformer layer of the ORIGINAL pretrained
# checkpoint (pretrain.base_model), run once offline over the training audio:
# k-means on layer-`layer` frames, then every frame -> its nearest centroid.
# Training then continues that same model against these ids. Not distillation.
# See pipeline.layer_features / .fit_kmeans / .assign_cluster_labels.
cluster:
  layer: 18                   # 3/4 of the way through the 24 layers of WavLM Large
  num_clusters: 500           # fairseq HuBERT iteration >= 2
  seed: 1337
  sample_hours: 40.0          # audio streamed for the k-means fit
  max_frames: 2000000         # frames kept for the fit (2M x 1024 fp32 = ~8 GB RAM)
  kmeans_output: models/kmeans/wavlm-large-L18-k500.joblib
  labels_output: data/labels/wavlm_train_labels.jsonl.gz

# ── Pre-training ────────────────────────────────────
pretrain:
  base_model: microsoft/wavlm-large
  precision: bf16
  freeze_feature_encoder: true
  layerdrop: 0.1              # same as main: XLS-R's stock config value (HuBERT/WavLM stock is 0.1 too)

  max_updates: 13500          # ~30 passes over 200h (was 50000 / 111 passes)
  warmup_updates: 1000        # ~8% (was 4000)
  peak_lr: 5.0e-5
  lr_schedule: tri_stage      # warmup / hold / exponential decay
  hold_ratio: 0.4             # fraction of remaining after warmup to hold
  optimizer: adamw
  adam_betas: [0.9, 0.98]
  adam_eps: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  head_lr_mult: 1.0           # same LR as everything else, as on main (the head is new; raise to warm it up faster)

  # batch size in AUDIO SECONDS (not examples)
  target_batch_seconds: 1600
  per_device_max_seconds: 200
  num_workers: 4
  max_gpu_memory_fraction: 0.8  # GB10 unified memory: leave ~24GB for the OS / sshd

  # masking (applied by WavLMModel itself). Same values as main's wav2vec2 run
  # so the comparison is fair (fairseq's own HuBERT default would be 0.8).
  mask_time_prob: 0.65
  mask_time_length: 10

  # WavLM utterance mixing (method, not tuning): 20% of utterances get another
  # utterance from the batch mixed in (<=50% overlap, -5..+5 dB). Labels stay clean.
  utterance_mix_prob: 0.2

  labels_path: data/labels/wavlm_train_labels.jsonl.gz

  # checkpointing
  save_every_updates: 1500
  eval_every_updates: 500
  keep_last_n_checkpoints: 5
  milestone_checkpoints: [4500, 9000, 13500]   # 10, 20, 30 passes

  output_dir: models/wavlm-large-si-ta-200h

# ── Checkpoint Selection ────────────────────────────
checkpoint_selection:
  proxy_task: asr
  proxy_data_dir: /home/anas22/EchoVerge-LABS/SLSB-benchmark/data
  proxy_seed: 0
  output_dir: models/selected

# ── Benchmark ───────────────────────────────────────
benchmark:
  tasks: "asr,sid,er,asv"
  seeds: "0,1,2"
  slsb_data_dir: /home/anas22/EchoVerge-LABS/SLSB-benchmark/data
  mlflow_uri: https://dagshub.com/EchoVerge-LABS/Model-Training-Pipeline.mlflow
  upstreams:
    xlsr300m_vanilla:
      path: facebook/wav2vec2-xls-r-300m
      name: "XLS-R 300M (vanilla)"
    mhubert147:
      path: utter-project/mHuBERT-147
      name: "mHuBERT-147"
    wavlm_large:
      path: microsoft/wavlm-large
      name: "WavLM Large"
    wavlm_large_adapted:
      path: models/selected
      name: "WavLM Large (Si/Ta 200h)"
      is_local: true
    # Single-language ablation (names must match reports/bench/<dir>, see experiment.py)
    wavlm-large-si-100h:
      path: models/selected_single/wavlm-large-si-100h
      name: "WavLM Large (Si 100h)"
      is_local: true
    wavlm-large-ta-100h:
      path: models/selected_single/wavlm-large-ta-100h
      name: "WavLM Large (Ta 100h)"
      is_local: true

  # reports/results_ablation.{md,csv}: frozen vs joint vs single-language, per benchmark
  # language. cross_language adds each single-language model's OTHER language.
  cross_language: true
  ablation_languages: [sinhala, tamil]
  ablation_rows:
    - {upstream: wavlm_large, mode: frozen, train_language: "—"}
    - {upstream: wavlm_large_adapted, mode: joint CoPT, train_language: sinhala+tamil,
       stats: reports/selection_stats.json, checkpoint_report: reports/checkpoint_selection.json}
    - {upstream: wavlm-large-si-100h, mode: single-language CoPT, train_language: sinhala, experiment: si-100h}
    - {upstream: wavlm-large-ta-100h, mode: single-language CoPT, train_language: tamil, experiment: ta-100h}

# ── MLflow ──────────────────────────────────────────
mlflow:
  tracking_uri: https://dagshub.com/EchoVerge-LABS/Model-Training-Pipeline.mlflow
  experiment_name: ssl-pretraining
