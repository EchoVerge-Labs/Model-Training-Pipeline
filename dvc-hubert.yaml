stages:

  snapshot_catalog:
    cmd: python -m pipeline.snapshot_catalog
         --sheet-id $GOOGLE_SHEET_ID
         --out data/catalog
    deps:
      - src/pipeline/snapshot_catalog.py
    outs:
      - data/catalog/catalog_latest.csv
    always_changed: true

  # name_in_drive isn't unique on the Drive, so clips are pinned to a real file
  # via (language, genre, name, size) against this index -- see drive_index.py.
  # Re-indexes whenever a new catalog snapshot changes.
  index_drive:
    cmd: python -m pipeline.drive_index --config params-hubert.yaml
    deps:
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
    params:
      - params-hubert.yaml:
          - select.drive_root
          - select.drive_index_path
    outs:
      - data/catalog/drive_index.tsv

  # Manifests and selection reports are small and worth diffing, so they live
  # in git (cache: false) rather than in the DVC cache.
  select:
    cmd: python -m pipeline.select --config params-hubert.yaml
    deps:
      - src/pipeline/select.py
      - src/pipeline/drive_index.py
      - data/catalog/catalog_latest.csv
      - data/catalog/drive_index.tsv
    params:
      - params-hubert.yaml:
          - select
    outs:
      - data/manifests/train.jsonl:
          cache: false
      - data/manifests/dev.jsonl:
          cache: false
      - reports/selection_report.md:
          cache: false
      - reports/unresolved_clips.csv:
          cache: false
    metrics:
      - reports/selection_stats.json:
          cache: false

  materialise:
    cmd: python -m pipeline.materialise --config params-hubert.yaml
    deps:
      - src/pipeline/materialise.py
      - data/manifests/train.jsonl
      - data/manifests/dev.jsonl
    params:
      - params-hubert.yaml:
          - select.drive_root
    outs:
      - data/raw/:
          persist: true
      - reports/materialise.json:
          cache: false

  shard:
    cmd: python -m pipeline.shard --config params-hubert.yaml
    deps:
      - src/pipeline/shard.py
      - data/raw/
      - data/manifests/train.jsonl
    params:
      - params-hubert.yaml:
          - shard
    outs:
      - data/shars/

  fit_kmeans:
    cmd: python -m pipeline.fit_kmeans --config params-hubert.yaml --report-suffix=-hubert
    deps:
      - src/pipeline/fit_kmeans.py
      - src/pipeline/layer_features.py
      - src/pipeline/datamodule.py
      - data/shars/
    params:
      - params-hubert.yaml:
          - cluster
          - shard
          - pretrain.base_model
    outs:
      - models/kmeans/km_model.joblib:
          persist: true
    metrics:
      - reports/kmeans_stats-hubert.json:
          cache: false

  assign_cluster_labels:
    cmd: python -m pipeline.assign_cluster_labels --config params-hubert.yaml
    deps:
      - src/pipeline/assign_cluster_labels.py
      - src/pipeline/layer_features.py
      - src/pipeline/datamodule.py
      - models/kmeans/km_model.joblib
      - data/shars/
    params:
      - params-hubert.yaml:
          - cluster
          - shard
          - pretrain.base_model
    outs:
      - data/labels/train_labels.jsonl.gz:
          persist: true

  pretrain:
    cmd: SCRIPT=src/pipeline/train_masked_prediction.py bash scripts/launch_pretrain.sh --config params-hubert.yaml
    deps:
      - src/pipeline/train_masked_prediction.py
      - src/pipeline/datamodule.py
      - src/pipeline/callbacks.py
      - src/pipeline/masked_prediction_model.py
      - src/pipeline/checkpoints.py
      - data/shars/
      - data/labels/train_labels.jsonl.gz
    params:
      - params-hubert.yaml:
          - pretrain
          - cluster.num_clusters
    outs:
      - models/hubert-large-si-ta-200h/:
          persist: true
    metrics:
      - reports/pretrain_metrics-hubert.json:
          cache: false
    plots:
      - reports/pretrain_curves-hubert.csv:
          cache: false

  select_checkpoint:
    cmd: python -m pipeline.select_checkpoint --config params-hubert.yaml --report-suffix=-hubert
    deps:
      - src/pipeline/select_checkpoint.py
      - models/hubert-large-si-ta-200h/
    params:
      - params-hubert.yaml:
          - checkpoint_selection
    outs:
      - models/selected-hubert/:
          persist: true
    metrics:
      - reports/checkpoint_selection-hubert.json:
          cache: false

  benchmark:
    cmd: >
      bash scripts/run_benchmark.sh
      models/selected-hubert
      ${benchmark.tasks}
      ${benchmark.seeds}
      reports/bench/hubert_large_adapted
      ${benchmark.mlflow_uri}
      ${benchmark.slsb_data_dir}
    deps:
      - models/selected-hubert/
      - scripts/run_benchmark.sh
    params:
      - params-hubert.yaml:
          - benchmark.tasks
          - benchmark.seeds
          - benchmark.slsb_data_dir
    metrics:
      - reports/bench/hubert_large_adapted/metrics.json:
          cache: false

  report:
    cmd: python -m pipeline.report --config params-hubert.yaml --report-suffix=-hubert
    deps:
      - src/pipeline/report.py
      - reports/bench/
    outs:
      - reports/results-hubert.md:
          cache: false
      - reports/results_table-hubert.csv:
          cache: false
