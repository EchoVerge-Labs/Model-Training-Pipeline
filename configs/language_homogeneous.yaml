# Joint 200h CoPT with language-homogeneous optimizer updates (WavLM Large).
#
# An OVERLAY on params.yaml: deep-merged over it (--overlay), so everything not
# listed here -- data selection, sharding, k-means labels, preprocessing, optimizer,
# LR schedule, masking, utterance mixing, batch audio-seconds, max_updates,
# checkpoint/eval frequency, checkpoint selection and benchmark settings -- is the
# original joint run's. Only batching (and the output locations that keep this run
# from overwriting it) differ. See README "Joint 200h CoPT with Language-Homogeneous Updates".

pretrain:
  output_dir: models/wavlm-large-si-ta-200h-homogeneous
  language_batching:
    enabled: true
    mode: balanced_random          # or: alternate (strict Sinhala/Tamil/Sinhala/...)
    languages: [sinhala, tamil]    # as spelled in the manifests' `language` field
    probabilities:
      sinhala: 0.5
      tamil: 0.5
    window: 20                     # every 20 consecutive updates: exactly 10 + 10, shuffled
    seed: 1337                     # = select.seed
    synchronize_across_ranks: true
    keep_language_across_gradient_accumulation: true
    # training refuses to start if the clip ids differ from the original joint run's
    reference_manifest: "git:origin/WavLM-Large:data/manifests/train.jsonl"
    dataset_check_report: reports/language_batching_dataset_check.json

experiment:
  reports_dir: reports/language_homogeneous
  mlflow_run_name: wavlm-large-copt-si-ta-200h-homogeneous-batches

# Same proxy task, seed and data as the original -- only where results are written.
checkpoint_selection:
  output_dir: models/selected-homogeneous
  report_path: reports/language_homogeneous/checkpoint_selection.json

benchmark:
  out_dir: reports/bench/wavlm_large_si_ta_200h_homogeneous
