# Accelerate config for 2-node DDP (if using accelerate launcher instead of torchrun)
# Not used by the default launch_pretrain.sh, provided as alternative
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
num_machines: 2
num_processes: 2
machine_rank: 0  # override per node
main_process_ip: "10.8.100.40"  # adjust to your master node IP
main_process_port: 29500
mixed_precision: bf16
